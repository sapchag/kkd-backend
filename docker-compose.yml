services:
  postgres:
    image: postgres:15-alpine
    container_name: kkd-postgres
    environment:
      POSTGRES_DB: kkd
      POSTGRES_USER: kkd
      POSTGRES_PASSWORD: kkd
    ports:
      - "5432:5432"
    volumes:
      - kkd-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kkd -d kkd"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: kkd-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/kkd
      DB_USER: kkd
      DB_PASSWORD: kkd
    ports:
      - "8080:8080"

volumes:
  kkd-pgdata: