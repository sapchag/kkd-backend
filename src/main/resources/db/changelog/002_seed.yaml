databaseChangeLog:
  - changeSet:
      id: 002-seed-reference
      author: sber-kkd
      changes:
        - insert:
            tableName: kkd_unit
            columns:
              - column: { name: id, value: 1 }
              - column: { name: code, value: "HQ-CIB" }
              - column: { name: name, value: "Департамент корпоративного бизнеса" }
              - column: { name: parent_id, value: null }
        - insert:
            tableName: kkd_unit
            columns:
              - column: { name: id, value: 2 }
              - column: { name: code, value: "CIB-SALES" }
              - column: { name: name, value: "Управление продаж корпоративным клиентам" }
              - column: { name: parent_id, value: 1 }
        - insert:
            tableName: kkd_unit
            columns:
              - column: { name: id, value: 3 }
              - column: { name: code, value: "CIB-MID" }
              - column: { name: name, value: "Управление среднего бизнеса" }
              - column: { name: parent_id, value: 1 }
        - insert:
            tableName: kkd_unit
            columns:
              - column: { name: id, value: 4 }
              - column: { name: code, value: "HQ-SME" }
              - column: { name: name, value: "Департамент малого и среднего бизнеса" }
              - column: { name: parent_id, value: null }
        - insert:
            tableName: kkd_unit
            columns:
              - column: { name: id, value: 5 }
              - column: { name: code, value: "SME-REG" }
              - column: { name: name, value: "Управление региональных продаж" }
              - column: { name: parent_id, value: 4 }

        # Справочник правил ККД (реализованные 4 правила)
        - insert:
            tableName: kkd_rule
            columns:
              - column: { name: code, value: "GOAL_NO_OWNER" }
              - column: { name: name, value: "Цель без ответственного" }
              - column: { name: severity, value: "critical" }
        - insert:
            tableName: kkd_rule
            columns:
              - column: { name: code, value: "GOAL_NO_KR" }
              - column: { name: name, value: "У активной цели нет ни одного ключевого результата" }
              - column: { name: severity, value: "critical" }
        - insert:
            tableName: kkd_rule
            columns:
              - column: { name: code, value: "CASCADE_NO_PARENT" }
              - column: { name: name, value: "Цель не связана с целью вышестоящего уровня" }
              - column: { name: severity, value: "major" }
        - insert:
            tableName: kkd_rule
            columns:
              - column: { name: code, value: "KR_WEIGHTS_SUM" }
              - column: { name: name, value: "Сумма весов ключевых результатов не равна 100%" }
              - column: { name: severity, value: "major" }

      rollback:
        - delete:
            tableName: kkd_issue
            where: 1=1
        - delete:
            tableName: kkd_rule
            where: 1=1

