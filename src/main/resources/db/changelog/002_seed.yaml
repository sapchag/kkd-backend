  - changeSet:
      id: 002-seed-kr
      author: sber-kkd
      changes:

        # G1: веса 50/50
        - insert: { tableName: kkd_kr, columns: [ { column: { name: goal_id, value: 1 } }, { column: { name: target_value, value: 100 } }, { column: { name: actual_value, value: 51 } }, { column: { name: weight, value: 50 } }, { column: { name: fact_updated_at, value: "2026-10-27 09:00:00" } } ] }
        - insert: { tableName: kkd_kr, columns: [ { column: { name: goal_id, value: 1 } }, { column: { name: target_value, value: 100 } }, { column: { name: actual_value, value: 80 } }, { column: { name: weight, value: 50 } }, { column: { name: fact_updated_at, value: "2026-10-27 09:00:00" } } ] }
        # G2: 1 КР (вес 100)
        - insert: { tableName: kkd_kr, columns: [ { column: { name: goal_id, value: 2 } }, { column: { name: target_value, value: 100 } }, { column: { name: actual_value, value: 10 } }, { column: { name: weight, value: 100 } }, { column: { name: fact_updated_at, value: "2026-10-27 09:00:00" } } ] }
        # G3: КР нет -> GOAL_NO_KR
        # G4: веса 40/40 (сумма 80)
        - insert: { tableName: kkd_kr, columns: [ { column: { name: goal_id, value: 4 } }, { column: { name: target_value, value: 100 } }, { column: { name: actual_value, value: 30 } }, { column: { name: weight, value: 40 } }, { column: { name: fact_updated_at, value: "2026-10-27 09:00:00" } } ] }
        - insert: { tableName: kkd_kr, columns: [ { column: { name: goal_id, value: 4 } }, { column: { name: target_value, value: 100 } }, { column: { name: actual_value, value: 60 } }, { column: { name: weight, value: 40 } }, { column: { name: fact_updated_at, value: "2026-10-27 09:00:00" } } ] }
        # G5: КР нет -> GOAL_NO_KR (и нет владельца)
        # G6: 1 КР, цель без родителя в дочернем подразделении -> CASCADE
        - insert: { tableName: kkd_kr, columns: [ { column: { name: goal_id, value: 6 } }, { column: { name: target_value, value: 100 } }, { column: { name: actual_value, value: 0 } }, { column: { name: weight, value: 100 } }, { column: { name: fact_updated_at, value: "2026-10-27 09:00:00" } } ] }
        # G7: 1 КР, родитель есть -> валидная
        - insert: { tableName: kkd_kr, columns: [ { column: { name: goal_id, value: 7 } }, { column: { name: target_value, value: 100 } }, { column: { name: actual_value, value: 50 } }, { column: { name: weight, value: 100 } }, { column: { name: fact_updated_at, value: "2026-10-27 09:00:00" } } ] }
        # G8: КР нет, нет владельца, нет родителя -> 3 правила
        # G9: веса 50/40 (сумма 90)
        - insert: { tableName: kkd_kr, columns: [ { column: { name: goal_id, value: 9 } }, { column: { name: target_value, value: 100 } }, { column: { name: actual_value, value: 20 } }, { column: { name: weight, value: 50 } }, { column: { name: fact_updated_at, value: "2026-10-27 09:00:00" } } ] }
        - insert: { tableName: kkd_kr, columns: [ { column: { name: goal_id, value: 9 } }, { column: { name: target_value, value: 100 } }, { column: { name: actual_value, value: 5 } }, { column: { name: weight, value: 40 } }, { column: { name: fact_updated_at, value: "2026-10-27 09:00:00" } } ] }
        # G10: 1 КР, родитель есть
        - insert: { tableName: kkd_kr, columns: [ { column: { name: goal_id, value: 10 } }, { column: { name: target_value, value: 100 } }, { column: { name: actual_value, value: 90 } }, { column: { name: weight, value: 100 } }, { column: { name: fact_updated_at, value: "2026-10-27 09:00:00" } } ] }
        # G11: КР нет, нет родителя
        # G12: 1 КР, нет владельца
        - insert: { tableName: kkd_kr, columns: [ { column: { name: goal_id, value: 12 } }, { column: { name: target_value, value: 100 } }, { column: { name: actual_value, value: 0 } }, { column: { name: weight, value: 100 } }, { column: { name: fact_updated_at, value: "2026-10-27 09:00:00" } } ] }
        # G13: 1 КР, корневое подразделение
        - insert: { tableName: kkd_kr, columns: [ { column: { name: goal_id, value: 13 } }, { column: { name: target_value, value: 100 } }, { column: { name: actual_value, value: 33 } }, { column: { name: weight, value: 100 } }, { column: { name: fact_updated_at, value: "2026-10-27 09:00:00" } } ] }
        # G14: 1 КР, нет родителя в дочернем подразделении -> CASCADE
        - insert: { tableName: kkd_kr, columns: [ { column: { name: goal_id, value: 14 } }, { column: { name: target_value, value: 100 } }, { column: { name: actual_value, value: 70 } }, { column: { name: weight, value: 100 } }, { column: { name: fact_updated_at, value: "2026-10-27 09:00:00" } } ] }
        # G15: КР нет, нет владельца
        # G18: 1 КР, валидная
        - insert: { tableName: kkd_kr, columns: [ { column: { name: goal_id, value: 18 } }, { column: { name: target_value, value: 100 } }, { column: { name: actual_value, value: 25 } }, { column: { name: weight, value: 100 } }, { column: { name: fact_updated_at, value: "2026-10-27 09:00:00" } } ] }
        # G19: 1 КР
        - insert: { tableName: kkd_kr, columns: [ { column: { name: goal_id, value: 19 } }, { column: { name: target_value, value: 100 } }, { column: { name: actual_value, value: 40 } }, { column: { name: weight, value: 100 } }, { column: { name: fact_updated_at, value: "2026-10-27 09:00:00" } } ] }
        # G20: 1 КР
        - insert: { tableName: kkd_kr, columns: [ { column: { name: goal_id, value: 20 } }, { column: { name: target_value, value: 100 } }, { column: { name: actual_value, value: 15 } }, { column: { name: weight, value: 100 } }, { column: { name: fact_updated_at, value: "2026-10-27 09:00:00" } } ] }
        # G17 (DRAFT): КР с весом 30/30 => не проверяется

      rollback:
        - delete:
            tableName: kkd_kr
            where: 1=1